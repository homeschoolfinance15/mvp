name: Deploy database

# The schema and the edge functions both live in this repo, and both deploy
# from here — one workflow owns everything that runs on Supabase.
#
# The schema lives in this repo as ordered SQL files under supabase/migrations.
# That IS the database deployment: this workflow replays any migration the
# linked Supabase project has not applied yet. Migrations are append-only —
# to change the schema, add a new file rather than editing an existing one,
# or the checksum in the remote migration history will stop matching.

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/functions/**'
      - '.github/workflows/deploy-database.yml'
  # Lets you replay migrations by hand from the Actions tab.
  workflow_dispatch:

# Two concurrent runs would race on the same migration history table.
concurrency:
  group: database-${{ github.ref }}
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      # Skip cleanly rather than failing every push while secrets are unset.
      - name: Check whether Supabase credentials are configured
        id: guard
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          if [ -n "$SUPABASE_ACCESS_TOKEN" ] && [ -n "$SUPABASE_PROJECT_REF" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::SUPABASE_ACCESS_TOKEN or SUPABASE_PROJECT_REF is not set — skipping migrations."
          fi

      - uses: supabase/setup-cli@v1
        if: steps.guard.outputs.ready == 'true'
        with:
          version: latest

      - name: Link project
        if: steps.guard.outputs.ready == 'true'
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Show what would be applied
        if: steps.guard.outputs.ready == 'true'
        run: supabase db push --dry-run
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Apply migrations
        if: steps.guard.outputs.ready == 'true'
        run: supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      # Every function, not a named one.
      #
      # This step used to deploy `recommend` alone, which was correct when it
      # was the only function whose code changed. It is now nine, and a named
      # list is a thing to forget: the event platform's six were deployed by
      # hand, and a later change to the mailer or to Stripe would have been
      # committed, reviewed, merged, and never reached production — with the
      # old code still running and nothing saying so.
      #
      # Function secrets (RESEND_API_KEY, MAILER_SECRET, ANTHROPIC_API_KEY,
      # STRIPE_*) are set once with `supabase secrets set` and live in
      # Supabase, not here. This ships code only.
      #
      # Per-function settings come from supabase/config.toml, which is why
      # `verify_jwt = false` for `event-mailer` and `stripe-webhook` is
      # declared there rather than passed as a flag. Both are called by things
      # that hold no Supabase session — a cron and Stripe — and each carries
      # its own gate inside the function. A deploy that lost those settings
      # would put the platform's auth wall in front of both and stop every
      # automatic email, silently.
      - name: Deploy edge functions
        if: steps.guard.outputs.ready == 'true'
        # --use-api bundles server-side instead of in Docker. It is how these
        # nine were built for production, and matching it means the first
        # automated deploy is not also the first change of bundler.
        run: supabase functions deploy --use-api --project-ref "$SUPABASE_PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
