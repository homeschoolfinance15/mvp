name: Deploy database

# The schema and the edge functions both live in this repo, and both deploy
# from here — one workflow owns everything that runs on Supabase.
#
# The schema lives in this repo as ordered SQL files under supabase/migrations.
# That IS the database deployment: this workflow replays any migration the
# linked Supabase project has not applied yet. Migrations are append-only —
# to change the schema, add a new file rather than editing an existing one,
# or the checksum in the remote migration history will stop matching.

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/functions/**'
      - 'scripts/**'
      - '.github/workflows/deploy-database.yml'
  # Lets you replay migrations by hand from the Actions tab.
  workflow_dispatch:

# Two concurrent runs would race on the same migration history table.
concurrency:
  group: database-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Nothing deploys until this passes.
  #
  # Until this job existed the edge functions were deployed by a pipeline that
  # had never once compiled them. `supabase functions deploy` bundles with
  # esbuild, which strips types without checking them, so a function whose
  # types were wrong deployed exactly as cleanly as one whose types were right
  # — and the twelve check-* scripts in scripts/, which assert the rules that
  # guard money, ran only when somebody remembered to run them by hand.
  #
  # It runs whether or not the Supabase secrets are configured, because none of
  # it needs them. A project that cannot deploy can still be told its code is
  # broken.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # 24, and the version is load-bearing rather than incidental:
      # check-payout-state.mjs imports `src/routes/connector/payouts.ts`
      # directly, so the runtime has to be able to load a TypeScript file.
      # Node strips types natively from 22.18 on; on 20 the import dies with
      # ERR_UNKNOWN_FILE_EXTENSION and takes the whole gate with it. Pinning
      # 20 here passed locally on 24 and failed on the first push, which is
      # exactly the class of thing this job exists to catch — so do not lower
      # it without either rewriting that import or running the script on Deno.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # Every function, found rather than listed — a named list is the thing
      # that goes stale, which is the same reason the deploy step below stopped
      # naming one.
      #
      # --node-modules-dir=none because the repo root carries a package.json
      # for the frontend, which puts Deno into node-compat mode and makes it
      # demand a populated node_modules for `npm:` specifiers. The functions
      # resolve those from Deno's own cache, exactly as they do in production.
      - name: Type-check every edge function
        run: deno check --node-modules-dir=none supabase/functions/*/index.ts

      # The offline half of the check suite: the ones that read source and
      # assert rules, with no database and no network. The rest
      # (check-rls, check-events, check-acceptance, check-readiness,
      # check-questionnaire) need a live project and stay manual.
      - name: Assert the offline rules
        run: |
          deno run --node-modules-dir=none --allow-read scripts/check-connect-state.ts
          node scripts/check-payout-state.mjs
          node scripts/check-organiser.mjs
          node scripts/check-attendee-rules.mjs
          node scripts/check-feedback-rules.mjs
          node scripts/check-invite-parity.mjs

  migrate:
    needs: check
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      # Skip cleanly rather than failing every push while secrets are unset.
      - name: Check whether Supabase credentials are configured
        id: guard
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          if [ -n "$SUPABASE_ACCESS_TOKEN" ] && [ -n "$SUPABASE_PROJECT_REF" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::SUPABASE_ACCESS_TOKEN or SUPABASE_PROJECT_REF is not set — skipping migrations."
          fi

      - uses: supabase/setup-cli@v1
        if: steps.guard.outputs.ready == 'true'
        with:
          version: latest

      - name: Link project
        if: steps.guard.outputs.ready == 'true'
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Show what would be applied
        if: steps.guard.outputs.ready == 'true'
        run: supabase db push --dry-run
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Apply migrations
        if: steps.guard.outputs.ready == 'true'
        run: supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      # Every function, not a named one.
      #
      # This step used to deploy `recommend` alone, which was correct when it
      # was the only function whose code changed. It is now ten, and a named
      # list is a thing to forget: the event platform's six were deployed by
      # hand, and a later change to the mailer or to Stripe would have been
      # committed, reviewed, merged, and never reached production — with the
      # old code still running and nothing saying so.
      #
      # Function secrets (RESEND_API_KEY, MAILER_SECRET, ANTHROPIC_API_KEY,
      # STRIPE_*) are set once with `supabase secrets set` and live in
      # Supabase, not here. This ships code only.
      #
      # Per-function settings come from supabase/config.toml, which is why
      # `verify_jwt = false` for `event-mailer` and `stripe-webhook` is
      # declared there rather than passed as a flag. Both are called by things
      # that hold no Supabase session — a cron and Stripe — and each carries
      # its own gate inside the function. A deploy that lost those settings
      # would put the platform's auth wall in front of both and stop every
      # automatic email, silently.
      - name: Deploy edge functions
        if: steps.guard.outputs.ready == 'true'
        # --use-api bundles server-side instead of in Docker. It is how these
        # ten were built for production, and matching it means the first
        # automated deploy is not also the first change of bundler.
        run: supabase functions deploy --use-api --project-ref "$SUPABASE_PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
